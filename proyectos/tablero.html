<title>Tablero de Pendientes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Concepto: cuatro vistas en pestañas sobre una lista compacta que se abre en ficha, etapa del proceso, archivos y bitácora. */
:root {
  --bg: #eef2f1; --surface: #ffffff; --surface-2: #e4eae8; --ink: #14201d; --ink-2: #4b5c58;
  --line: #cfd9d6; --accent: #0f766e; --accent-ink: #ffffff; --accent-soft: #cfe8e4;
  --wait: #9a5b0b; --wait-soft: #f6e6c9; --ok: #2f7d4f; --danger: #b3261e; --danger-soft: #f7dedc;
  --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1716; --surface: #172220; --surface-2: #1f2e2b; --ink: #e6efed; --ink-2: #9fb3ae;
    --line: #2b3d39; --accent: #3cc2b3; --accent-ink: #06201d; --accent-soft: #17403b;
    --wait: #e2a950; --wait-soft: #3a2c12; --ok: #6cc58c; --danger: #f2877f; --danger-soft: #42211f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1716; --surface: #172220; --surface-2: #1f2e2b; --ink: #e6efed; --ink-2: #9fb3ae;
  --line: #2b3d39; --accent: #3cc2b3; --accent-ink: #06201d; --accent-soft: #17403b;
  --wait: #e2a950; --wait-soft: #3a2c12; --ok: #6cc58c; --danger: #f2877f; --danger-soft: #42211f; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 17px; font-weight: 600; }
h3 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); }
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.date { color: var(--ink-2); text-transform: capitalize; font-size: 14px; margin-top: 2px; }
.nav, .acts { display: flex; gap: 6px; flex-wrap: wrap; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-height: 40px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.sm { min-height: 36px; padding: 6px 10px; font-size: 14px; }
.btn[disabled] { opacity: .55; cursor: default; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
input[type="text"], input[type="date"], input[type="email"], textarea, select {
  min-width: 0; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
input[type="text"], input[type="date"], input[type="email"], select { min-height: 42px; }
textarea { width: 100%; resize: vertical; min-height: 64px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; }
.tab { background: transparent; border: 1px solid transparent; border-radius: 99px; padding: 7px 14px; min-height: 38px; color: var(--ink-2); white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; border-color: var(--accent); }
.tab .n { font-variant-numeric: tabular-nums; opacity: .8; }
.capture { display: grid; gap: 10px; }
.capture .row { display: flex; flex-wrap: wrap; gap: 10px; }
.capture input[type="text"] { flex: 1 1 200px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { padding: 9px 14px; cursor: pointer; background: var(--bg); color: var(--ink-2); min-height: 42px; display: flex; align-items: center; }
.seg input:checked + label { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: -2px; }
.strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 6px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.day[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.day .dn { font-size: 12px; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.06em; }
.day .dd { font-family: var(--font-display); font-weight: 600; font-size: 18px; }
.day.today .dd::after { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: 4px; vertical-align: middle; }
.bar { width: 100%; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); border-radius: 3px; }
.bar.proc > i { background: var(--accent); }
.day .ct { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.kpi .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); }
.kpi .val { font-family: var(--font-display); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpi .val small { font-size: 16px; color: var(--ink-2); font-weight: 500; }
.kpi .val.alert { color: var(--danger); }
.kpi .bar { margin-top: 8px; }
.lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
.lists .panel, .panel.list { display: flex; flex-direction: column; gap: 10px; }
.head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.head span { color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; }
ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
li { border-top: 1px solid var(--line); }
li:first-child { border-top: 0; }
.row2 { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; }
.chk { flex: none; width: 24px; height: 24px; margin-top: 1px; border-radius: 6px; border: 2px solid var(--ink-2); background: transparent; display: grid; place-items: center; padding: 0; }
.chk[aria-checked="true"] { background: var(--ok); border-color: var(--ok); }
.chk svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.chk[aria-checked="true"] svg { opacity: 1; }
.open { flex: 1; min-width: 0; text-align: left; background: transparent; border: 0; padding: 0; display: flex; align-items: flex-start; gap: 8px; }
.open .t { overflow-wrap: anywhere; }
.open .meta { display: block; font-size: 12px; color: var(--ink-2); margin-top: 2px; }
li.done .open .t { text-decoration: line-through; color: var(--ink-2); }
.caret { flex: none; color: var(--ink-2); transition: transform .15s ease; margin-top: 2px; }
li.exp .caret { transform: rotate(90deg); }
@media (prefers-reduced-motion: reduce) { .caret { transition: none; } }
.chip { display: inline-block; margin-top: 3px; margin-right: 5px; padding: 1px 8px; border-radius: 99px; background: var(--wait-soft); color: var(--wait); font-size: 12px; font-weight: 500; }
.chip.n { background: var(--surface-2); color: var(--ink-2); }
.chip.late { background: var(--danger-soft); color: var(--danger); }
.chip.step { background: var(--accent-soft); color: var(--accent); }
.x { flex: none; border: 0; background: transparent; color: var(--ink-2); width: 32px; height: 32px; border-radius: 6px; }
.x:hover { background: var(--surface-2); }
.x.arm { color: var(--danger); font-size: 12px; width: auto; padding: 0 8px; font-weight: 600; }
.det { background: var(--surface-2); border-radius: 8px; padding: 12px; margin: 0 0 10px 34px; display: flex; flex-direction: column; gap: 12px; }
.ficha { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.f .fl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); display: block; margin-bottom: 3px; }
.f .fv { font-variant-numeric: tabular-nums; }
.f .fv.late { color: var(--danger); font-weight: 600; }
.f input { width: 100%; min-height: 36px; background: var(--surface); }
.procbox { background: var(--surface); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.procbox .pl { font-size: 12px; color: var(--ink-2); }
.steps { display: flex; flex-direction: column; gap: 3px; margin-top: 4px; }
.steps .s { font-size: 13px; color: var(--ink-2); display: flex; gap: 7px; }
.steps .s.cur { color: var(--ink); font-weight: 600; }
.steps .s.ok { text-decoration: line-through; }
.log { display: flex; flex-direction: column; }
.log .e { display: flex; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); }
.log .e:first-child { border-top: 0; }
.log .when { flex: none; width: 92px; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; padding-top: 2px; }
.log .what { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.log .who { font-size: 11px; color: var(--ink-2); }
.addlog, .inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.addlog input { flex: 1 1 180px; background: var(--surface); }
.files { display: flex; flex-wrap: wrap; gap: 8px; }
.file { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font-size: 13px; max-width: 100%; }
.file a { color: var(--accent); overflow-wrap: anywhere; }
.file img { width: 34px; height: 34px; object-fit: cover; border-radius: 4px; }
.empty { color: var(--ink-2); padding: 6px 0 2px; }
.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; background: var(--wait-soft); color: var(--ink); border: 1px solid var(--wait); border-radius: 10px; padding: 12px 14px; }
.notice { color: var(--ink-2); font-size: 13px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-size: 14px; max-width: 90vw; z-index: 40; }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 30; display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
.modal { background: var(--surface); border-radius: 12px; border: 1px solid var(--line); padding: 18px; width: 100%; max-width: 560px; max-height: 85vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.modal .mh { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.tplgrid { display: flex; flex-direction: column; gap: 8px; }
.tpl { text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.tpl:hover { border-color: var(--accent); }
.tpl b { font-family: var(--font-display); }
.tpl span { display: block; font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.draft { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; white-space: pre-wrap; font-size: 14px; overflow-wrap: anywhere; }
.dir { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.card { background: var(--surface-2); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
.card .nm { font-family: var(--font-display); font-weight: 600; }
.card .ar { font-size: 13px; color: var(--ink-2); }
.card .rl { font-size: 13px; }
.card .ro { display: flex; gap: 6px; margin-top: 6px; }
.srch { display: flex; gap: 10px; flex-wrap: wrap; }
.srch input { flex: 1 1 220px; }
@media (max-width: 520px) {
  h1 { font-size: 22px; } .day { padding-inline: 2px; } .day .dd { font-size: 16px; } .kpi .val { font-size: 26px; }
  .det { margin-left: 0; } .log .when { width: 76px; }
}
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .25s ease; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Tablero de pendientes</h1>
      <div class="date" id="dateLabel"></div>
    </div>
    <div class="acts">
      <button class="btn" id="btnTpl">Plantilla</button>
      <button class="btn" id="btnAsk" hidden>Dictar al asistente</button>
      <button class="btn" id="btnWeek" hidden>Resumen semanal</button>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist"></nav>

  <div id="view"></div>

  <div class="notice" id="status"></div>
</div>

<div id="modalHost"></div>

<script>
(function () {
  var TZ = 'America/Mexico_City';
  var DN = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
  var TABS = [
    { k: 'board', n: 'Tablero' }, { k: 'wait', n: 'Esperando' },
    { k: 'hist', n: 'Historial' }, { k: 'dir', n: 'Directorio' }
  ];

  // Plantillas derivadas de los procesos que el usuario ya explicó.
  var TEMPLATES = [
    { k: 'flujo_interno', n: 'Compra por flujo interno',
      d: 'Nosotros generamos factura y OC; a la semana siguiente va a flujo de pago.',
      steps: [
        { t: 'Iniciar proceso de compra por flujo interno', off: 0 },
        { t: 'Generar la factura (la hacemos nosotros)', off: 0 },
        { t: 'Generar la orden de compra', off: 0 },
        { t: 'Meter a flujo de pago', off: 7, kind: 'week' }
      ] },
    { k: 'alta_enkontrol', n: 'Alta de insumos en Enkontrol',
      d: 'Se solicita y se espera a Cristal, de contabilidad.',
      steps: [
        { t: 'Hacer la solicitud de alta', off: 0 },
        { t: 'Esperar el alta', off: 0, wait: 'Cristal (contabilidad)', fu: 2 },
        { t: 'Confirmar que el insumo quedó dado de alta', off: 2 }
      ] },
    { k: 'pedido_proveedor', n: 'Pedido a proveedor',
      d: 'Cotizar, esperar autorización de otra área, OC, entrega, recepción e inventario.',
      steps: [
        { t: 'Cotizar o confirmar precio', off: 0, wait: 'Proveedor', fu: 2 },
        { t: 'Pedir autorización al área que aprueba', off: 1, wait: 'Área que autoriza', fu: 2 },
        { t: 'Emitir o recibir la orden de compra', off: 2 },
        { t: 'Seguimiento de entrega', off: 3, wait: 'Proveedor', fu: 3 },
        { t: 'Recepción', off: 5 },
        { t: 'Actualizar inventario', off: 5 }
      ] }
  ];
  function tplOf(k) { for (var i = 0; i < TEMPLATES.length; i++) if (TEMPLATES[i].k === k) return TEMPLATES[i]; return null; }

  var tasks = [], contacts = [], db = null, assets = null, downloads = null, sample = null;
  var tab = 'board', selected = todayStr(), query = '';
  var expanded = {}, armed = null, armTimer = null, drafts = {}, focusKey = null, caret = null, modal = null;

  function todayStr() { return new Date().toLocaleDateString('en-CA', { timeZone: TZ }); }
  function parse(s) { var p = String(s).split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])); }
  function fmt(d) { return d.toISOString().slice(0, 10); }
  function addDays(s, n) { var d = parse(s); d.setUTCDate(d.getUTCDate() + n); return fmt(d); }
  function mondayOf(s) { var d = parse(s); return addDays(s, -((d.getUTCDay() + 6) % 7)); }
  function longLabel(s) { return parse(s).toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' }); }
  function shortDate(s) { return s ? parse(s).toLocaleDateString('es-MX', { day: '2-digit', month: 'short', timeZone: 'UTC' }) : '—'; }
  function stamp(ms) { return new Date(ms).toLocaleString('es-MX', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: TZ }); }
  function daysSince(ms) { return Math.max(0, Math.floor((Date.now() - (ms || Date.now())) / 864e5)); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function $(id) { return document.getElementById(id); }
  function pct(d, t) { return t ? Math.round(d * 100 / t) : 0; }
  function newId(p) { return (p || 't') + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
  function isLate(t) { return !t.done && t.followUp && t.followUp <= todayStr(); }

  function toast(msg) {
    var old = document.querySelector('.toast'); if (old) old.remove();
    var t = el('div', 'toast', msg); t.setAttribute('role', 'status'); document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 4000);
  }
  async function write(fn) { try { await fn(); return true; } catch (e) { toast('No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.'); return false; } }
  function ref(id) { return db.collection('tasks').doc(id); }
  function cref(id) { return db.collection('contacts').doc(id); }
  function logOf(t) { return Array.isArray(t.log) ? t.log : []; }
  function filesOf(t) { return Array.isArray(t.files) ? t.files : []; }
  function entry(text) { return { at: Date.now(), text: text, by: 'yo' }; }

  function patch(t, data, logText) {
    if (!db) return Promise.resolve(false);
    if (logText) data.log = logOf(t).concat([entry(logText)]);
    return write(function () { return ref(t.id).update(data); });
  }
  function toggle(t) { patch(t, { done: !t.done, doneAt: !t.done ? Date.now() : null }, !t.done ? 'Marcada como hecha' : 'Reabierta'); }
  function remove(t) { if (db) write(function () { return ref(t.id).delete(); }); }
  function arm(id) { armed = id; render(); clearTimeout(armTimer); armTimer = setTimeout(function () { armed = null; render(); }, 3000); }

  function dayTasks(d) { return tasks.filter(function (t) { return t.kind === 'day' && t.date === d; }); }
  function weekTasks(m) { return tasks.filter(function (t) { return t.kind === 'week' && t.date === m; }); }
  function waitingTasks() { return tasks.filter(function (t) { return !t.done && (t.waitingOn || t.followUp); }); }
  function stat(list) { return { d: list.filter(function (t) { return t.done; }).length, t: list.length }; }

  function track(input, key) {
    if (drafts[key] != null) input.value = drafts[key];
    input.dataset.k = key;
    input.addEventListener('input', function () { drafts[key] = input.value; });
    input.addEventListener('focus', function () { focusKey = key; });
  }
  function restoreFocus() {
    if (!focusKey) return;
    var n = document.querySelector('[data-k="' + focusKey + '"]');
    if (!n) return;
    n.focus();
    if (caret != null && n.setSelectionRange) { try { n.setSelectionRange(caret, caret); } catch (e) {} }
  }

  /* ---------- Modales ---------- */
  function closeModal() { if (modal) { modal.remove(); modal = null; } }
  function openModal(title, build) {
    closeModal();
    var scrim = el('div', 'scrim');
    scrim.addEventListener('click', function (e) { if (e.target === scrim) closeModal(); });
    var m = el('div', 'modal'); m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.setAttribute('aria-label', title);
    var h = el('div', 'mh'); h.appendChild(el('h2', '', title));
    var c = el('button', 'btn sm', 'Cerrar'); c.type = 'button'; c.addEventListener('click', closeModal); h.appendChild(c);
    m.appendChild(h); build(m);
    scrim.appendChild(m); $('modalHost').appendChild(scrim); modal = scrim;
    var first = m.querySelector('input, textarea, button.tpl'); if (first) first.focus();
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });

  function openTemplates() {
    openModal('Iniciar un proceso', function (m) {
      m.appendChild(el('p', 'notice', 'Elige el proceso y escribe de qué se trata. Creo todos sus pasos con sus fechas.'));
      var asunto = el('input'); asunto.type = 'text'; asunto.maxLength = 120;
      asunto.placeholder = 'De qué se trata, por ejemplo: filtros MADISA';
      asunto.setAttribute('aria-label', 'Asunto');
      m.appendChild(asunto);
      var g = el('div', 'tplgrid');
      TEMPLATES.forEach(function (tp) {
        var b = el('button', 'tpl'); b.type = 'button';
        b.appendChild(el('b', '', tp.n));
        b.appendChild(el('span', '', tp.d + ' · ' + tp.steps.length + ' pasos'));
        b.addEventListener('click', function () { startTemplate(tp, asunto.value.trim()); });
        g.appendChild(b);
      });
      m.appendChild(g);
    });
  }

  async function startTemplate(tp, asunto) {
    if (!db) { toast('Abre esta página con tu sesión de Claude para guardar.'); return; }
    if (!asunto) { toast('Escribe primero de qué se trata.'); return; }
    closeModal();
    var group = newId('g'), base = todayStr(), now = Date.now(), ok = 0;
    for (var i = 0; i < tp.steps.length; i++) {
      var s = tp.steps[i];
      var kind = s.kind === 'week' ? 'week' : 'day';
      var date = kind === 'week' ? mondayOf(addDays(base, s.off || 0)) : addDays(base, s.off || 0);
      var d = {

  async function weeklySummary() {

    var mon = mondayOf(todayStr()), lines = ['# Resumen de la semana del ' + shortDate(mon), ''];
    var hechas = [], abiertas = [], esperas = [];
    tasks.forEach(function (t) {

      if (!inWeek) return;

    });
    function block(title, list, withLog) {
      lines.push('## ' + title + ' (' + list.length + ')', '');

        lines.push('- **' + t.title + '**' + (t.step ? ' _(paso ' + t.step + ' de ' + t.steps + ')_' : ''));

      });
      lines.push('');

    block('Terminadas', hechas, true);
    block('Esperando respuesta', esperas, true);

    try {

    kpi('Toca revisar hoy', lateN, lateN === 1 ? 'tarea' : 'tareas', null, lateN > 0);
    host.appendChild(kp);

    var lists = el('div', 'lists');
    lists.appendChild(listPanel('Tareas del día', dayTasks(selected), 'Sin tareas para este día. Agrega una arriba o usa una plantilla.'));
    lists.appendChild(listPanel('Tareas de la semana', weekTasks(mon), 'Sin tareas semanales.'));
    host.appendChild(lists);
  }

  function viewWait(host) {
    var list = waitingTasks().sort(function (a, b) {
      var al = isLate(a) ? 0 : 1, bl = isLate(b) ? 0 : 1;
      return al - bl || String(a.followUp || '9').localeCompare(String(b.followUp || '9')) || (a.createdAt || 0) - (b.createdAt || 0);
    });
    host.appendChild(listPanel('Esperando respuesta', list,
      'Nada en espera. Cuando registres una tarea con "esperando a", aparece aquí con su fecha de revisión.',
      { showDate: false, chip: function (t) {
          var d = daysSince(t.createdAt);
          return 'lleva ' + d + (d === 1 ? ' día' : ' días') + (t.followUp ? ' · revisar ' + shortDate(t.followUp) : '');
        } }));
  }

  function viewHist(host) {
    var p = el('div', 'panel list');
    var h = el('div', 'srch');
    var si = el('input'); si.type = 'text'; si.placeholder = 'Buscar en títulos, detalle y actividad'; si.setAttribute('aria-label', 'Buscar');
    si.value = query; track(si, 'q');
    si.addEventListener('input', function () { query = si.value; clearTimeout(si._t); si._t = setTimeout(render, 220); });
    h.appendChild(si); p.appendChild(h);

    var q = query.trim().toLowerCase();
    var list = tasks.filter(function (t) {
      if (!q) return t.done;
      var hay = (t.title + ' ' + (t.notes || '') + ' ' + (t.procName || '') + ' ' + (t.waitingOn || '') + ' ' +
        logOf(t).map(function (e) { return e.text; }).join(' ')).toLowerCase();
      return hay.indexOf(q) > -1;
    }).sort(function (a, b) { return (b.doneAt || b.createdAt || 0) - (a.doneAt || a.createdAt || 0); });

    p.appendChild(el('h2', '', q ? 'Resultados' : 'Tareas cerradas'));
    p.appendChild(el('div', 'notice', q ? list.length + ' coincidencias, abiertas y cerradas.' : 'Escribe arriba para buscar también entre las abiertas.'));
    if (!list.length) p.appendChild(el('div', 'empty', q ? 'Nada coincide con esa búsqueda.' : 'Todavía no cierras ninguna tarea.'));
    else { var ul = el('ul'); list.slice(0, 100).forEach(function (t) { ul.appendChild(rowFor(t, { showDate: true })); }); p.appendChild(ul); }
    host.appendChild(p);
  }

  function viewDir(host) {
    var p = el('div', 'panel list');
    p.appendChild(el('h2', '', 'Personas, áreas y proveedores'));
    p.appendChild(el('div', 'notice', 'Quién es quién y para qué. Lo uso al armar los correos de insistencia.'));

    var form = el('form', 'srch'); form.autocomplete = 'off';
    var n = el('input'); n.type = 'text'; n.placeholder = 'Nombre'; n.setAttribute('aria-label', 'Nombre'); track(n, 'c:n');
    var a = el('input'); a.type = 'text'; a.placeholder = 'Área o empresa'; a.setAttribute('aria-label', 'Área'); track(a, 'c:a');
    var r = el('input'); r.type = 'text'; r.placeholder = 'Para qué'; r.setAttribute('aria-label', 'Para qué'); track(r, 'c:r');
    var b = el('button', 'btn primary', 'Agregar'); b.type = 'submit';
    form.appendChild(n); form.appendChild(a); form.appendChild(r); form.appendChild(b);
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var nm = n.value.trim(); if (!nm) { n.focus(); return; }
      if (!db) { toast('Abre esta página con tu sesión de Claude para guardar.'); return; }
      var data = { name: nm, area: a.value.trim(), role: r.value.trim(), createdAt: Date.now() };
      n.value = ''; a.value = ''; r.value = '';
      delete drafts['c:n']; delete drafts['c:a']; delete drafts['c:r'];
      write(function () { return cref(newId('c')).set(data); });
    });
    p.appendChild(form);

    if (!contacts.length) p.appendChild(el('div', 'empty', 'Sin contactos todavía. Agrega a Cristal, a Alfredo o a un proveedor.'));
    else {
      var g = el('div', 'dir');
      contacts.slice().sort(function (x, y) { return String(x.name).localeCompare(String(y.name)); }).forEach(function (c) {
        var card = el('div', 'card');
        card.appendChild(el('div', 'nm', c.name));
        if (c.area) card.appendChild(el('div', 'ar', c.area));
        if (c.role) card.appendChild(el('div', 'rl', c.role));
        var open = tasks.filter(function (t) { return !t.done && t.waitingOn && t.waitingOn.toLowerCase().indexOf(String(c.name).toLowerCase()) > -1; });
        if (open.length) card.appendChild(el('div', 'chip', open.length + ' pendiente' + (open.length === 1 ? '' : 's') + ' con esta persona'));
        var ro = el('div', 'ro');
        var del = el('button', 'btn sm', 'Quitar'); del.type = 'button';
        del.addEventListener('click', function () { if (db) write(function () { return cref(c.id).delete(); }); });
        ro.appendChild(del); card.appendChild(ro);
        g.appendChild(card);
      });
      p.appendChild(g);
    }
    host.appendChild(p);
  }

  /* ---------- Render ---------- */
  function render() {
    var act = document.activeElement;
    if (act && act.dataset && act.dataset.k) { focusKey = act.dataset.k; caret = act.selectionStart; }

    $('dateLabel').textContent = longLabel(selected) + (selected === todayStr() ? ' · hoy' : '');

    var tb = $('tabs'); tb.textContent = '';
    var counts = { board: dayTasks(selected).filter(function (t) { return !t.done; }).length,
                   wait: waitingTasks().length, hist: tasks.filter(function (t) { return t.done; }).length, dir: contacts.length };
    TABS.forEach(function (t) {
      var b = el('button', 'tab'); b.type = 'button'; b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', tab === t.k ? 'true' : 'false');
      b.appendChild(document.createTextNode(t.n + ' '));
      b.appendChild(el('span', 'n', String(counts[t.k] || 0)));
      b.addEventListener('click', function () { tab = t.k; render(); });
      tb.appendChild(b);
    });

    var host = $('view'); host.textContent = '';
    host.style.display = 'flex'; host.style.flexDirection = 'column'; host.style.gap = '16px';
    if (tab === 'board') viewBoard(host);
    else if (tab === 'wait') viewWait(host);
    else if (tab === 'hist') viewHist(host);
    else viewDir(host);

    restoreFocus();
  }

  $('btnTpl').addEventListener('click', openTemplates);
  $('btnAsk').addEventListener('click', openAsk);
  $('btnWeek').addEventListener('click', weeklySummary);

  render();

  var loadTimer = setTimeout(function () { $('status').textContent = 'Todavía no se alcanzan los datos guardados. Puede que lo que ves no esté al día.'; }, 10000);
  (async function () {
    try { db = window.claude && await window.claude.use('db'); } catch (e) { db = null; }
    try { assets = window.claude && await window.claude.use('assets'); } catch (e) { assets = null; }
    try { downloads = window.claude && await window.claude.use('downloads'); } catch (e) { downloads = null; }
    try { sample = window.claude && await window.claude.use('sample'); } catch (e) { sample = null; }
    if (downloads) $('btnWeek').hidden = false;
    if (sample) $('btnAsk').hidden = false;
    if (!db) { clearTimeout(loadTimer); $('status').textContent = 'Para guardar tus tareas abre esta página con tu sesión de Claude.'; render(); return; }
    db.collection('tasks').onSnapshot(function (snap) {
      tasks = snap.docs.map(function (d) { var x = Object.assign({}, d.data()); x.id = d.id; return x; });
      if (!snap.metadata.fromCache) { clearTimeout(loadTimer); $('status').textContent = ''; }
      render();
    }, function () { clearTimeout(loadTimer); $('status').textContent = 'No se pudieron leer las tareas guardadas.'; });
    db.collection('contacts').onSnapshot(function (snap) {
      contacts = snap.docs.map(function (d) { var x = Object.assign({}, d.data()); x.id = d.id; return x; });
      render();
    }, function () {});
  })();
})();
</script>
