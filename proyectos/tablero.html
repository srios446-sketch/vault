<title>Tablero de Pendientes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Concepto: lista compacta que se abre en ficha + bitácora; captura arriba, semana en tira, panel aparte para lo que espera respuesta. */
:root {
  --bg: #eef2f1; --surface: #ffffff; --surface-2: #e4eae8; --ink: #14201d; --ink-2: #4b5c58;
  --line: #cfd9d6; --accent: #0f766e; --accent-ink: #ffffff; --accent-soft: #cfe8e4;
  --wait: #9a5b0b; --wait-soft: #f6e6c9; --ok: #2f7d4f; --danger: #b3261e;
  --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1716; --surface: #172220; --surface-2: #1f2e2b; --ink: #e6efed; --ink-2: #9fb3ae;
    --line: #2b3d39; --accent: #3cc2b3; --accent-ink: #06201d; --accent-soft: #17403b;
    --wait: #e2a950; --wait-soft: #3a2c12; --ok: #6cc58c; --danger: #f2877f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1716; --surface: #172220; --surface-2: #1f2e2b; --ink: #e6efed; --ink-2: #9fb3ae;
  --line: #2b3d39; --accent: #3cc2b3; --accent-ink: #06201d; --accent-soft: #17403b;
  --wait: #e2a950; --wait-soft: #3a2c12; --ok: #6cc58c; --danger: #f2877f; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 17px; font-weight: 600; }
h3 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); }
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.date { color: var(--ink-2); text-transform: capitalize; font-size: 14px; margin-top: 2px; }
.nav { display: flex; gap: 6px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-height: 40px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.sm { min-height: 36px; padding: 6px 10px; font-size: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
input[type="text"], textarea { min-width: 0; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
input[type="text"] { min-height: 42px; }
textarea { width: 100%; resize: vertical; min-height: 64px; }
.capture { display: grid; gap: 10px; }
.capture .row { display: flex; flex-wrap: wrap; gap: 10px; }
.capture input[type="text"] { flex: 1 1 200px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { padding: 9px 14px; cursor: pointer; background: var(--bg); color: var(--ink-2); min-height: 42px; display: flex; align-items: center; }
.seg input:checked + label { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: -2px; }
.strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 6px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.day[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.day .dn { font-size: 12px; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.06em; }
.day .dd { font-family: var(--font-display); font-weight: 600; font-size: 18px; }
.day.today .dd::after { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: 4px; vertical-align: middle; }
.bar { width: 100%; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); border-radius: 3px; }
.day .ct { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.kpi .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); }
.kpi .val { font-family: var(--font-display); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpi .val small { font-size: 16px; color: var(--ink-2); font-weight: 500; }
.kpi .bar { margin-top: 8px; }
.lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
.lists .panel { display: flex; flex-direction: column; gap: 10px; }
.head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.head span { color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; }
ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
li { border-top: 1px solid var(--line); }
li:first-child { border-top: 0; }
.row2 { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; }
.chk { flex: none; width: 24px; height: 24px; margin-top: 1px; border-radius: 6px; border: 2px solid var(--ink-2); background: transparent; display: grid; place-items: center; padding: 0; }
.chk[aria-checked="true"] { background: var(--ok); border-color: var(--ok); }
.chk svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.chk[aria-checked="true"] svg { opacity: 1; }
.open { flex: 1; min-width: 0; text-align: left; background: transparent; border: 0; padding: 0; display: flex; align-items: flex-start; gap: 8px; }
.open .t { overflow-wrap: anywhere; }
.open .meta { display: block; font-size: 12px; color: var(--ink-2); margin-top: 2px; }
li.done .open .t { text-decoration: line-through; color: var(--ink-2); }
.caret { flex: none; color: var(--ink-2); transition: transform .15s ease; margin-top: 2px; }
li.exp .caret { transform: rotate(90deg); }
@media (prefers-reduced-motion: reduce) { .caret { transition: none; } }
.chip { display: inline-block; margin-top: 3px; padding: 1px 8px; border-radius: 99px; background: var(--wait-soft); color: var(--wait); font-size: 12px; font-weight: 500; }
.chip.n { background: var(--surface-2); color: var(--ink-2); }
.x { flex: none; border: 0; background: transparent; color: var(--ink-2); width: 32px; height: 32px; border-radius: 6px; }
.x:hover { background: var(--surface-2); }
.x.arm { color: var(--danger); font-size: 12px; width: auto; padding: 0 8px; font-weight: 600; }
.det { background: var(--surface-2); border-radius: 8px; padding: 12px; margin: 0 0 10px 34px; display: flex; flex-direction: column; gap: 12px; }
.ficha { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.f .fl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); display: block; margin-bottom: 3px; }
.f .fv { font-variant-numeric: tabular-nums; }
.f input[type="text"] { width: 100%; min-height: 36px; background: var(--surface); }
.log { display: flex; flex-direction: column; gap: 0; }
.log .e { display: flex; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); }
.log .e:first-child { border-top: 0; }
.log .when { flex: none; width: 92px; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; padding-top: 2px; }
.log .what { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.log .who { font-size: 11px; color: var(--ink-2); }
.addlog { display: flex; gap: 8px; flex-wrap: wrap; }
.addlog input { flex: 1 1 180px; background: var(--surface); }
.empty { color: var(--ink-2); padding: 6px 0 2px; }
.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; background: var(--wait-soft); color: var(--ink); border: 1px solid var(--wait); border-radius: 10px; padding: 12px 14px; }
.notice { color: var(--ink-2); font-size: 13px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-size: 14px; max-width: 90vw; z-index: 20; }
@media (max-width: 520px) {
  h1 { font-size: 22px; } .day { padding-inline: 2px; } .day .dd { font-size: 16px; } .kpi .val { font-size: 26px; }
  .det { margin-left: 0; } .log .when { width: 76px; }
}
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .25s ease; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Tablero de pendientes</h1>
      <div class="date" id="dateLabel"></div>
    </div>
    <div class="nav">
      <button class="btn" id="prev" aria-label="Día anterior">‹</button>
      <button class="btn" id="goToday">Hoy</button>
      <button class="btn" id="next" aria-label="Día siguiente">›</button>
    </div>
  </header>

  <form class="panel capture" id="addForm" autocomplete="off">
    <div class="row">
      <input type="text" id="newTitle" placeholder="Nueva tarea, por ejemplo: compra de filtros MADISA" maxlength="200" aria-label="Nueva tarea">
      <div class="seg" role="radiogroup" aria-label="Cuándo">
        <input type="radio" name="kind" id="k-day" value="day" checked><label for="k-day">Hoy</label>
        <input type="radio" name="kind" id="k-week" value="week"><label for="k-week">Semana</label>
      </div>
    </div>
    <div class="row">
      <input type="text" id="newWait" placeholder="Esperando a (opcional): persona, área…" maxlength="80" aria-label="Esperando a">
      <button class="btn primary" type="submit">Agregar</button>
    </div>
  </form>

  <div id="carry" class="banner" hidden></div>

  <section class="strip" id="strip" aria-label="Semana"></section>

  <section class="kpis" id="kpis"></section>

  <section class="lists">
    <div class="panel" id="dayPanel"></div>
    <div class="panel" id="weekPanel"></div>
  </section>

  <section class="panel" id="waitPanel"></section>

  <div class="notice" id="status"></div>
</div>

<script>
(function () {
  var TZ = 'America/Mexico_City';
  var DN = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
  var tasks = [], db = null, selected = todayStr();
  var expanded = {}, armed = null, armTimer = null, drafts = {}, focusKey = null, caret = null;

  function todayStr() { return new Date().toLocaleDateString('en-CA', { timeZone: TZ }); }
  function parse(s) { var p = String(s).split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])); }
  function fmt(d) { return d.toISOString().slice(0, 10); }
  function addDays(s, n) { var d = parse(s); d.setUTCDate(d.getUTCDate() + n); return fmt(d); }
  function mondayOf(s) { var d = parse(s); return addDays(s, -((d.getUTCDay() + 6) % 7)); }
  function longLabel(s) { return parse(s).toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' }); }
  function stamp(ms) { return new Date(ms).toLocaleString('es-MX', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: TZ }); }
  function daysSince(ms) { return Math.max(0, Math.floor((Date.now() - (ms || Date.now())) / 864e5)); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function $(id) { return document.getElementById(id); }
  function pct(d, t) { return t ? Math.round(d * 100 / t) : 0; }

  function toast(msg) {
    var old = document.querySelector('.toast'); if (old) old.remove();
    var t = el('div', 'toast', msg); t.setAttribute('role', 'status'); document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 3500);
  }
  async function write(fn) { try { await fn(); } catch (e) { toast('No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.'); } }
  function ref(id) { return db.collection('tasks').doc(id); }

  function logOf(t) { return Array.isArray(t.log) ? t.log : []; }
  function addEntry(t, text, done) {
    var entry = { at: Date.now(), text: text, by: 'yo' };
    var next = logOf(t).concat([entry]);
    var patch = { log: next };
    if (done != null) { patch.done = done; patch.doneAt = done ? Date.now() : null; }
    return write(function () { return ref(t.id).update(patch); });
  }
  function toggle(t) {
    if (!db) return;
    var txt = !t.done ? 'Marcada como hecha' : 'Reabierta';
    addEntry(t, txt, !t.done);
  }
  function remove(t) { if (db) write(function () { return ref(t.id).delete(); }); }
  function arm(id) { armed = id; render(); clearTimeout(armTimer); armTimer = setTimeout(function () { armed = null; render(); }, 3000); }

  function dayTasks(d) { return tasks.filter(function (t) { return t.kind === 'day' && t.date === d; }); }
  function weekTasks(m) { return tasks.filter(function (t) { return t.kind === 'week' && t.date === m; }); }
  function stat(list) { return { d: list.filter(function (t) { return t.done; }).length, t: list.length }; }

  // Mantener lo escrito aunque llegue una actualización de otro dispositivo
  function track(input, key) {
    if (drafts[key] != null) input.value = drafts[key];
    input.dataset.k = key;
    input.addEventListener('input', function () { drafts[key] = input.value; });
    input.addEventListener('focus', function () { focusKey = key; });
  }
  function restoreFocus() {
    if (!focusKey) return;
    var n = document.querySelector('[data-k="' + focusKey + '"]');
    if (!n) return;
    n.focus();
    if (caret != null && n.setSelectionRange) { try { n.setSelectionRange(caret, caret); } catch (e) {} }
  }

  function detail(t) {
    var d = el('div', 'det');

    var ficha = el('div', 'ficha');
    function field(label, node) { var f = el('div', 'f'); f.appendChild(el('span', 'fl', label)); f.appendChild(node); ficha.appendChild(f); }
    field('Estado', el('div', 'fv', t.done ? 'Hecha' : 'Abierta'));
    field('Registrada', el('div', 'fv', t.createdAt ? stamp(t.createdAt) + ' · hace ' + daysSince(t.createdAt) + 'd' : '—'));
    field('Tipo', el('div', 'fv', t.kind === 'week' ? 'De la semana' : 'Del día'));
    var wi = el('input'); wi.type = 'text'; wi.maxLength = 80; wi.placeholder = 'Nadie'; wi.value = t.waitingOn || '';
    wi.setAttribute('aria-label', 'Esperando a');
    track(wi, 'wait:' + t.id);
    wi.addEventListener('change', function () {
      var v = wi.value.trim(); if (v === (t.waitingOn || '')) return;
      delete drafts['wait:' + t.id];
      write(function () { return ref(t.id).update({ waitingOn: v, log: logOf(t).concat([{ at: Date.now(), text: v ? 'Ahora espera a ' + v : 'Ya no espera a nadie', by: 'yo' }]) }); });
    });
    field('Esperando a', wi);
    d.appendChild(ficha);

    var nw = el('div'); nw.appendChild(el('h3', '', 'Detalle del proceso'));
    var ta = el('textarea'); ta.placeholder = 'Explica aquí el proceso completo: de dónde sale, quién interviene, qué pasa después.';
    ta.value = t.notes || ''; ta.setAttribute('aria-label', 'Detalle del proceso');
    track(ta, 'notes:' + t.id);
    ta.addEventListener('change', function () {
      var v = ta.value; if (v === (t.notes || '')) return;
      delete drafts['notes:' + t.id];
      write(function () { return ref(t.id).update({ notes: v }); });
    });
    nw.appendChild(ta); d.appendChild(nw);

    var lw = el('div'); lw.appendChild(el('h3', '', 'Actividad'));
    var log = el('div', 'log'), entries = logOf(t).slice().sort(function (a, b) { return a.at - b.at; });
    if (!entries.length) log.appendChild(el('div', 'empty', 'Sin movimientos todavía. Escribe abajo lo que vaya pasando.'));
    entries.forEach(function (e) {
      var r = el('div', 'e');
      r.appendChild(el('div', 'when', stamp(e.at)));
      var w = el('div', 'what'); w.appendChild(document.createTextNode(e.text));
      if (e.by === 'asistente') w.appendChild(el('div', 'who', 'asistente'));
      r.appendChild(w); log.appendChild(r);
    });
    lw.appendChild(log);

    var add = el('div', 'addlog');
    var ai = el('input'); ai.type = 'text'; ai.maxLength = 300; ai.placeholder = 'Qué pasó, por ejemplo: generamos la OC';
    ai.setAttribute('aria-label', 'Agregar avance');
    track(ai, 'log:' + t.id);
    function submit() {
      var v = ai.value.trim(); if (!v) return;
      ai.value = ''; delete drafts['log:' + t.id];
      addEntry(t, v, null);
    }
    ai.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); submit(); } });
    var ab = el('button', 'btn sm primary', 'Agregar'); ab.type = 'button'; ab.addEventListener('click', submit);
    add.appendChild(ai); add.appendChild(ab); lw.appendChild(add);
    d.appendChild(lw);
    return d;
  }

  function rowFor(t, showWait) {
    var isOpen = !!expanded[t.id];
    var li = el('li', (t.done ? 'done ' : '') + (isOpen ? 'exp' : ''));
    var row = el('div', 'row2');

    var b = el('button', 'chk'); b.type = 'button'; b.setAttribute('role', 'checkbox');
    b.setAttribute('aria-checked', t.done ? 'true' : 'false'); b.setAttribute('aria-label', 'Marcar: ' + t.title);
    b.innerHTML = '<svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg>';
    b.addEventListener('click', function () { toggle(t); });

    var op = el('button', 'open'); op.type = 'button';
    op.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    var car = el('span', 'caret', '▸'); car.setAttribute('aria-hidden', 'true');
    var tx = el('span'); tx.appendChild(el('span', 't', t.title));
    var bits = [];
    if (showWait && t.waitingOn && !t.done) bits.push('espera a ' + t.waitingOn);
    var n = logOf(t).length; if (n) bits.push(n + (n === 1 ? ' movimiento' : ' movimientos'));
    if (t.notes) bits.push('con detalle');
    if (bits.length) tx.appendChild(el('span', 'meta', bits.join(' · ')));
    op.appendChild(car); op.appendChild(tx);
    op.addEventListener('click', function () { if (isOpen) delete expanded[t.id]; else expanded[t.id] = 1; render(); });

    var x = el('button', 'x'); x.type = 'button';
    if (armed === t.id) { x.className = 'x arm'; x.textContent = '¿Borrar?'; x.addEventListener('click', function () { armed = null; remove(t); }); }
    else { x.textContent = '✕'; x.setAttribute('aria-label', 'Borrar: ' + t.title); x.addEventListener('click', function () { arm(t.id); }); }

    row.appendChild(b); row.appendChild(op); row.appendChild(x);
    li.appendChild(row);
    if (isOpen) li.appendChild(detail(t));
    return li;
  }

  function fillPanel(panel, title, list, emptyMsg) {
    panel.textContent = '';
    var s = stat(list), head = el('div', 'head');
    head.appendChild(el('h2', '', title)); head.appendChild(el('span', '', s.d + ' de ' + s.t));
    panel.appendChild(head);
    var bar = el('div', 'bar'), i = el('i'); i.style.width = pct(s.d, s.t) + '%'; bar.appendChild(i); panel.appendChild(bar);
    if (!list.length) { panel.appendChild(el('div', 'empty', emptyMsg)); return; }
    var ul = el('ul');
    list.slice().sort(function (a, b) { return (a.done - b.done) || ((a.createdAt || 0) - (b.createdAt || 0)); })
      .forEach(function (t) { ul.appendChild(rowFor(t, true)); });
    panel.appendChild(ul);
  }

  function render() {
    var act = document.activeElement;
    if (act && act.dataset && act.dataset.k) { focusKey = act.dataset.k; caret = act.selectionStart; }

    var today = todayStr(), mon = mondayOf(selected);
    $('dateLabel').textContent = longLabel(selected) + (selected === today ? ' · hoy' : '');

    var late = tasks.filter(function (t) { return t.kind === 'day' && !t.done && t.date < today; });
    var carry = $('carry');
    if (late.length && db) {
      carry.hidden = false; carry.textContent = '';
      carry.appendChild(el('span', '', late.length + (late.length === 1 ? ' tarea de días anteriores sigue sin cerrar.' : ' tareas de días anteriores siguen sin cerrar.')));
      var mv = el('button', 'btn', 'Pasar a hoy'); mv.type = 'button';
      mv.addEventListener('click', async function () {
        for (var i = 0; i < late.length; i++) {
          try { await ref(late[i].id).update({ date: today, log: logOf(late[i]).concat([{ at: Date.now(), text: 'Pasada a ' + today, by: 'yo' }]) }); }
          catch (e) { toast('No se pudieron mover todas.'); break; }
        }
        selected = today; render();
      });
      carry.appendChild(mv);
    } else carry.hidden = true;

    var strip = $('strip'); strip.textContent = '';
    for (var i = 0; i < 6; i++) {
      (function (i) {
        var d = addDays(mon, i), s = stat(dayTasks(d));
        var b = el('button', 'day' + (d === today ? ' today' : '')); b.type = 'button';
        b.setAttribute('aria-pressed', d === selected ? 'true' : 'false');
        b.setAttribute('aria-label', longLabel(d) + ': ' + s.d + ' de ' + s.t + ' hechas');
        b.appendChild(el('span', 'dn', DN[i])); b.appendChild(el('span', 'dd', String(parse(d).getUTCDate())));
        var bar = el('div', 'bar'), f = el('i'); f.style.width = pct(s.d, s.t) + '%'; bar.appendChild(f); b.appendChild(bar);
        b.appendChild(el('span', 'ct', s.t ? s.d + '/' + s.t : '—'));
        b.addEventListener('click', function () { selected = d; render(); });
        strip.appendChild(b);
      })(i);
    }

    var dS = stat(dayTasks(selected));
    var wAll = []; for (var k = 0; k < 7; k++) wAll = wAll.concat(dayTasks(addDays(mon, k)));
    wAll = wAll.concat(weekTasks(mon));
    var wS = stat(wAll);
    var waiting = tasks.filter(function (t) { return !t.done && t.waitingOn; });

    var kp = $('kpis'); kp.textContent = '';
    function kpi(label, big, small, p) {
      var c = el('div', 'panel kpi'); c.appendChild(el('div', 'lbl', label));
      var v = el('div', 'val', String(big));
      if (small != null) { v.appendChild(document.createTextNode(' ')); v.appendChild(el('small', '', small)); }
      c.appendChild(v);
      if (p != null) { var bar = el('div', 'bar'), f = el('i'); f.style.width = p + '%'; bar.appendChild(f); c.appendChild(bar); }
      kp.appendChild(c);
    }
    kpi(selected === today ? 'Avance de hoy' : 'Avance del día', dS.d, 'de ' + dS.t, pct(dS.d, dS.t));
    kpi('Avance de la semana', wS.d, 'de ' + wS.t, pct(wS.d, wS.t));
    kpi('Esperando respuesta', waiting.length, waiting.length === 1 ? 'pendiente' : 'pendientes', null);

    fillPanel($('dayPanel'), 'Tareas del día', dayTasks(selected), 'Sin tareas para este día. Agrega una arriba.');
    fillPanel($('weekPanel'), 'Tareas de la semana', weekTasks(mon), 'Sin tareas semanales. Agrega una arriba y elige "Semana".');

    var wp = $('waitPanel'); wp.textContent = '';
    var wh = el('div', 'head'); wh.appendChild(el('h2', '', 'Esperando respuesta')); wh.appendChild(el('span', '', waiting.length + ' abiertas')); wp.appendChild(wh);
    if (!waiting.length) wp.appendChild(el('div', 'empty', 'Nada en espera. Al agregar una tarea, escribe a quién esperas y aparecerá aquí con los días que lleva.'));
    else {
      var ul = el('ul');
      waiting.sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0); }).forEach(function (t) {
        var days = daysSince(t.createdAt);
        var li = rowFor(t, false);
        var tx = li.querySelector('.open > span:last-child');
        tx.appendChild(el('span', 'chip', t.waitingOn + ' · lleva ' + days + (days === 1 ? ' día' : ' días') + (days >= 2 ? ' · toca insistir' : '')));
        ul.appendChild(li);
      });
      wp.appendChild(ul);
    }

    restoreFocus();
  }

  $('addForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var title = $('newTitle').value.trim(); if (!title) { $('newTitle').focus(); return; }
    if (!db) { toast('Abre esta página con tu sesión de Claude para guardar tareas.'); return; }
    var kind = document.querySelector('input[name="kind"]:checked').value;
    var id = 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    var wait = $('newWait').value.trim();
    var data = { title: title, kind: kind, date: kind === 'week' ? mondayOf(selected) : selected, done: false,
      waitingOn: wait, notes: '', createdAt: Date.now(),
      log: [{ at: Date.now(), text: 'Registrada' + (wait ? ', esperando a ' + wait : ''), by: 'yo' }] };
    $('newTitle').value = ''; $('newWait').value = '';
    expanded[id] = 1;
    write(function () { return ref(id).set(data); });
  });
  $('prev').addEventListener('click', function () { selected = addDays(selected, -1); render(); });
  $('next').addEventListener('click', function () { selected = addDays(selected, 1); render(); });
  $('goToday').addEventListener('click', function () { selected = todayStr(); render(); });

  render();

  var loadTimer = setTimeout(function () { $('status').textContent = 'Todavía no se alcanzan los datos guardados. Puede que lo que ves no esté al día.'; }, 10000);
  (async function () {
    try { db = window.claude && await window.claude.use('db'); } catch (e) { db = null; }
    if (!db) { clearTimeout(loadTimer); $('status').textContent = 'Para guardar tus tareas abre esta página con tu sesión de Claude.'; return; }
    db.collection('tasks').onSnapshot(function (snap) {
      tasks = snap.docs.map(function (d) { var x = Object.assign({}, d.data()); x.id = d.id; return x; });
      if (!snap.metadata.fromCache) { clearTimeout(loadTimer); $('status').textContent = ''; }
      render();
    }, function () { clearTimeout(loadTimer); $('status').textContent = 'No se pudieron leer las tareas guardadas.'; });
  })();
})();
</script>
